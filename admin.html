<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;padding:15px;background:#fff7fb;max-width:500px;margin:auto}input,textarea{width:100%;padding:10px;margin:7px 0;border:1px solid #ccc;border-radius:8px}button{background:#7b174d;color:#fff;padding:12px;width:100%;border:0;border-radius:8px}</style></head><body><h2>পণ্য যোগ করুন</h2><input id="img" placeholder="ছবির লিংক"><input id="name" placeholder="পণ্যের নাম"><input id="price" placeholder="দাম"><textarea id="desc" placeholder="বিবরণ"></textarea><button onclick="add()">যোগ করুন</button><div id="list"></div><script>function get(){return JSON.parse(localStorage.getItem('p')||'[]')}function save(a){localStorage.setItem('p',JSON.stringify(a))}function add(){let o={img:img.value,name:name.value,price:price.value,desc:desc.value};if(!o.img||!o.name)return alert('নাম ছবি লাগবে');let a=get();a.push(o);save(a);show();alert('হয়েছে')}function show(){let a=get();list.innerHTML=a.map((x,i)=>`<div style='background:#fff;padding:10px;margin:10px 0;border-radius:8px'><img src=${x.img} style='width:100%'><h3>${x.name}</h3><p>${x.price} টাকা</p></div>`).join('')}show()</script></body></html>
