<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK shop.BD</title>
<style>
body{font-family:Arial;margin:0;background:#fff7fb}
header{background:#7b174d;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001;text-align:center;padding-bottom:10px}
.card img{width:100%;height:160px;object-fit:cover}
.card h3{font-size:14px;margin:8px 5px}
.price{color:#7b174d;font-weight:bold}
.btn{background:#7b174d;color:#fff;border:0;padding:8px 15px;border-radius:20px;margin-top:5px}
</style>
</head>
<body>
<header>SK shop.BD</header>
<div id="box" class="products"></div>
<p id="empty" style="text-align:center;padding:40px;color:#999">এখনো কোনো পণ্য নেই, admin থেকে যোগ করুন</p>
<script>
let data=JSON.parse(localStorage.getItem('p')||'[]');
let box=document.getElementById('box');
let emp=document.getElementById('empty');
if(data.length>0){emp.style.display='none';
box.innerHTML=data.map(x=>`<div class=card><img src="${x.img}"><h3>${x.name}</h3><div class=price>৳${x.price}</div><button class=btn onclick="location.href='https://wa.me/8801XXXXXXXXX?text='+encodeURIComponent('আমি ${x.name} অর্ডার করতে চাই') ">অর্ডার</button></div>`).join('')}
</script>
</body>
</html>
