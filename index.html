<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK shop.BD</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#fff7fb;
color:#333;
}

header{
background:#7b174d;
color:white;
padding:15px;
text-align:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

header p{
margin-top:5px;
font-size:14px;
}

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.search{
display:flex;
gap:8px;
margin-bottom:15px;
}

.search input{
flex:1;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

button{
border:0;
border-radius:8px;
padding:10px 15px;
cursor:pointer;
font-weight:bold;
}

.search button,
.add-btn{
background:#ff4f9a;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.product{
background:white;
border-radius:12px;
padding:12px;
box-shadow:0 2px 10px #00000012;
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
background:#eee;
}

.product h3{
margin:10px 0 5px;
font-size:17px;
}

.price{
color:#e91e63;
font-size:20px;
font-weight:bold;
}

.old{
color:#999;
text-decoration:line-through;
font-size:14px;
margin-left:5px;
}

.cart{
margin-top:25px;
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 2px 10px #00000012;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
padding:10px 0;
gap:10px;
}

.total{
font-size:20px;
font-weight:bold;
margin:15px 0;
}

.checkout{
background:#25d366;
color:white;
width:100%;
font-size:17px;
}

.admin{
margin-top:25px;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px #00000012;
}

.admin h2{
color:#7b174d;
margin-bottom:15px;
}

.admin input,
.admin textarea{
width:100%;
padding:11px;
margin:6px 0;
border:1px solid #ddd;
border-radius:7px;
}

.admin textarea{
height:80px;
resize:vertical;
}

.admin-products{
margin-top:20px;
}

.admin-product{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:10px 0;
border-bottom:1px solid #eee;
}

.delete{
background:#e53935;
color:white;
}

.edit{
background:#ff9800;
color:white;
}

.login{
background:#f7e8f0;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.hidden{
display:none;
}

.qr{
text-align:center;
margin:25px 0;
}

footer{
margin-top:30px;
background:#7b174d;
color:white;
text-align:center;
padding:20px;
}

@media(max-width:500px){
.products{
grid-template-columns:repeat(2,1fr);
}

.product img{
height:140px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">SK shop.BD</div>
<p>আপনার পছন্দের পণ্য এখন এক জায়গায়</p>
</header>

<div class="container">

<div class="search">
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">
<button onclick="showProducts()">Search</button>
</div>

<h2>🛍️ আমাদের পণ্য</h2>
<br>

<div id="products" class="products"></div>

<div class="cart">
<h2>🛒 Shopping Cart</h2>
<div id="cart"></div>
<div class="total">মোট: ৳<span id="total">0</span></div>

<button class="checkout" onclick="checkout()">
WhatsApp-এ অর্ডার করুন
</button>
</div>

<div class="admin">

<h2>🔐 Admin Panel</h2>

<div id="loginBox" class="login">
<input id="adminPassword" type="password" placeholder="Admin Password">
<button class="add-btn" onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">

<h3>➕ নতুন পণ্য যোগ করুন</h3>

<input id="productName" placeholder="পণ্যের নাম">

<input id="productPrice" type="number" placeholder="বর্তমান দাম">

<input id="productOldPrice" type="number" placeholder="পুরোনো দাম">

<input id="productImage" placeholder="ছবির URL">

<textarea id="productDescription" placeholder="পণ্যের বিবরণ"></textarea>

<button class="add-btn" onclick="saveProduct()">
পণ্য যোগ করুন
</button>

<div class="admin-products">
<h3>📦 পণ্য পরিচালনা</h3>
<div id="adminProducts"></div>
</div>

</div>
</div>

<div class="qr">
<h2>📱 আমাদের ওয়েবসাইট</h2>
<p>QR Code স্ক্যান করে ওয়েবসাইটে প্রবেশ করুন</p>
<div id="qrcode"></div>
</div>

</div>

<footer>
© 2026 SK shop.BD
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const ADMIN_PASSWORD = "123456";

let products = JSON.parse(localStorage.getItem("sk_products")) || [

{
name:"প্রিমিয়াম শাড়ি",
price:1290,
old:1590,
image:"",
description:"সুন্দর প্রিমিয়াম শাড়ি"
},

{
name:"ফ্যাশন ড্রেস",
price:990,
old:1250,
image:"",
description:"আকর্ষণীয় ফ্যাশন ড্রেস"
},

{
name:"লেডিস ব্যাগ",
price:790,
old:950,
image:"",
description:"স্টাইলিশ লেডিস ব্যাগ"
},

{
name:"ফ্যাশন জুতা",
price:1190,
old:1450,
image:"",
description:"ফ্যাশনেবল জুতা"
}

];

let cart = [];
let editIndex = -1;

function saveData(){
localStorage.setItem("sk_products",JSON.stringify(products));
}

function showProducts(){

let search=document.getElementById("search").value.toLowerCase();

let list=products.filter(p=>
p.name.toLowerCase().includes(search)
);

let html="";

list.forEach((p,index)=>{

html+=`

<div class="product">

${p.image ?
`<img src="${p.image}" alt="${p.name}">`
:
`<div style="height:180px;background:#f5d9e7;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px">🛍️</div>`
}

<h3>${p.name}</h3>

<div>
<span class="price">৳${p.price}</span>

${p.old ?
`<span class="old">৳${p.old}</span>`
:""}

</div>

<p style="margin:8px 0;color:#666">
${p.description || ""}
</p>

<button class="add-btn" onclick="addCart(${index})">
কার্টে যোগ করুন
</button>

</div>

`;

});

document.getElementById("products").innerHTML=html;

}

function addCart(index){

cart.push(products[index]);

showCart();

alert("পণ্য কার্টে যোগ হয়েছে");

}

function showCart(){

let html="";
let total=0;

cart.forEach((p,index)=>{

total+=Number(p.price);

html+=`

<div class="cart-item">

<div>
<b>${p.name}</b>
<br>
৳${p.price}
</div>

<button class="delete" onclick="removeCart(${index})">
X
</button>

</div>

`;

});

document.getElementById("cart").innerHTML=html;

document.getElementById("total").innerText=total;

}

function removeCart(index){

cart.splice(index,1);

showCart();

}

function checkout(){

if(cart.length===0){

alert("কার্ট খালি");

return;

}

let name=prompt("আপনার নাম লিখুন:");

if(!name)return;

let phone=prompt("আপনার মোবাইল নম্বর লিখুন:");

if(!phone)return;

let address=prompt("আপনার সম্পূর্ণ ঠিকানা লিখুন:");

if(!address)return;

let message="🛍️ SK shop.BD নতুন অর্ডার%0A%0A";

cart.forEach((p,i)=>{

message+=(i+1)+". "+p.name+" - ৳"+p.price+"%0A";

});

message+="%0Aমোট: ৳"+document.getElementById("total").innerText;

message+="%0A%0A👤 নাম: "+name;

message+="%0A📞 ফোন: "+phone;

message+="%0A📍 ঠিকানা: "+address;

window.open(
"https://wa.me/8801855840824?text="+message,
"_blank"
);

}

function login(){

let pass=document.getElementById("adminPassword").value;

if(pass===ADMIN_PASSWORD){

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("adminPanel").classList.remove("hidden");

showAdminProducts();

}else{

alert("ভুল Password");

}

}

function saveProduct(){

let name=document.getElementById("productName").value;

let price=document.getElementById("productPrice").value;

let old=document.getElementById("productOldPrice").value;

let image=document.getElementById("productImage").value;

let description=document.getElementById("productDescription").value;

if(!name || !price){

alert("পণ্যের নাম এবং দাম দিন");

return;

}

let product={
name:name,
price:Number(price),
old:Number(old),
image:image,
description:description
};

if(editIndex===-1){

products.push(product);

}else{

products[editIndex]=product;

editIndex=-1;

}

saveData();

clearForm();

showProducts();

showAdminProducts();

alert("পণ্য সফলভাবে সংরক্ষণ হয়েছে");

}

function clearForm(){

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productOldPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDescription").value="";

}

function showAdminProducts(){

let html="";

products.forEach((p,index)=>{

html+=`

<div class="admin-product">

<div>
<b>${p.name}</b>
<br>
৳${p.price}
</div>

<div>

<button class="edit" onclick="editProduct(${index})">
Edit
</button>

<button class="delete" onclick="deleteProduct(${index})">
Delete
</button>

</div>

</div>

`;

});

document.getElementById("adminProducts").innerHTML=html;

}

function editProduct(index){

let p=products[index];

document.getElementById("productName").value=p.name;

document.getElementById("productPrice").value=p.price;

document.getElementById("productOldPrice").value=p.old;

document.getElementById("productImage").value=p.image;

document.getElementById("productDescription").value=p.description;

editIndex=index;

window.scrollTo({
top:document.querySelector(".admin").offsetTop,
behavior:"smooth"
});

}

function deleteProduct(index){

if(confirm("এই পণ্যটি Delete করতে চান?")){

products.splice(index,1);

saveData();

showProducts();

showAdminProducts();

}

}

showProducts();

showCart();

new QRCode(
document.getElementById("qrcode"),
{
text:window.location.href,
width:180,
height:180
}
);

</script>

</body>
</html>
